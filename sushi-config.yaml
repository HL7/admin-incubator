id: hl7.fhir.uv.admin-incubator
canonical: http://hl7.org/fhir/uv/admin-incubator/ImplementationGuide/hl7.fhir.uv.admin-incubator
version: 0.1.0
name: AdministrativeIncubator
title: FHIR R6 Administrative Incubator
status: active
publisher:
  name: HL7 International / Patient Administration
  url: http://www.hl7.org/Special/committees/pa
contact:
    telecom:
      - system: url
        value: http://www.hl7.org/Special/committees/pa
description: The Administrative Incubator specification is a workspace for developing and testing administrative resources that are planned to be implemented in FHIR, but can iterate their definition faster than the core R6 specification.
license: CC0-1.0
fhirVersion: 6.0.0-snapshot1
instanceOptions:
  manualSliceOrdering: true
parameters:
  apply-publisher: true
  apply-contact: true
  globals-in-artifacts: true
  show-inherited-invariants: false
  shownav: false
  special-url-base: http://hl7.org/fhir
  auto-oid-root: 2.16.840.1.113883.4.642.40.96 
  path-pages:
    - input/pagecontent
  path-resource:
    - input/resources/chargeitem
    - input/resources/chargeitemdefinition
    - input/resources/personalrelationship
    - input/resources/encounterhistory
    - input/resources/verificationresult
    - input/resources/patient
    - input/resources/encounter
    - input/resources/episodeofcare
  additional-resource: 
    - input/resources/chargeitem/StructureDefinition-ChargeItem.xml
    - input/resources/chargeitemdefinition/StructureDefinition-ChargeItemDefinition.xml
    - input/resources/personalrelationship/StructureDefinition-PersonalRelationship.xml
    - input/resources/encounterhistory/StructureDefinition-EncounterHistory.xml
    - input/resources/verificationresult/StructureDefinition-VerificationResult.xml
  special-url:
    - http://hl7.org/fhir/SearchParameter/verificationresult-validator-organization
    - http://hl7.org/fhir/SearchParameter/VerificationResult-validation-status
    
copyrightYear: 2022+
releaseLabel: STU 1
jurisdiction: http://unstats.un.org/unsd/methods/m49/m49.htm#001 "World"
extension:
  - url: http://hl7.org/fhir/StructureDefinition/structuredefinition-standards-status
    valueCode: "trial-use"
  - url: http://hl7.org/fhir/StructureDefinition/structuredefinition-fmm
    valueInteger: "3"
  - url: http://hl7.org/fhir/StructureDefinition/structuredefinition-wg
    valueCode: "pa"

dependencies:
  hl7.fhir.uv.immunization-incubator: current
  hl7.fhir.r6.examples: 6.0.0-snapshot1
  
resources:
  ChargeItem/example:
    name: ChargeItem - General
    description: Example of chargeitem
    isExample: true
    profile: http://hl7.org/fhir/StructureDefinition/ChargeItem
  ChargeItemDefinition/ebm:
    name: EBM Billing Code
    description: example definition of EMB code 30110 (from a german billing system)
    isExample: true
    profile: http://hl7.org/fhir/StructureDefinition/ChargeItemDefinition
  ChargeItemDefinition/device:
    name: Billing information for Device
    description: instance-specific billing information for a device with time-dependent tax rate
    isExample: true
    profile: http://hl7.org/fhir/StructureDefinition/ChargeItemDefinition
  EncounterHistory/example:
    name: EncounterHistory - example
    description: EncounterHistory example
    isExample: true
    profile: http://hl7.org/fhir/StructureDefinition/EncounterHistory
  Patient/jane:
    name: Jane
    description: Jane, Mary's mother in the family relationship examples.
    isExample: true
  Patient/john:
    name: John
    description: John, Mary's father in the family relationship examples.
    isExample: true
  Patient/mary:
    name: Mary
    description: Mary, the child in the family relationship examples.
    isExample: true
  Patient/alice:
    name: Alice
    description: Alice, Jane's mother and Mary and Peter's maternal grandmother.
    isExample: true
  Patient/robert:
    name: Robert
    description: Robert, Jane's father and Mary and Peter's maternal grandfather.
    isExample: true
  Patient/peter:
    name: Peter
    description: Peter, Jane and John's son and Mary's brother.
    isExample: true
  Patient/tom:
    name: Tom
    description: Tom, John's son, Jane's stepson, and Mary's half-brother.
    isExample: true
  Patient/anna:
    name: Anna
    description: Anna, Jane and John's adopted daughter.
    isExample: true
  Patient/emma:
    name: Emma
    description: Emma, Leo's foster mother.
    isExample: true
  Patient/david:
    name: David
    description: David, Leo's foster father.
    isExample: true
  Patient/leo:
    name: Leo
    description: Leo, Emma and David's foster son.
    isExample: true
  PersonalRelationship/example:
    name: Benedicte
    description: PersonalRelationship Benedicte du Marche
    isExample: true
    profile: http://hl7.org/fhir/StructureDefinition/PersonalRelationship
  PersonalRelationship/mary-daughter-jane:
    name: Mary is Jane's daughter
    description: Mary (source) is the daughter (relationshipType) of Jane (target), with certain confidence.
    isExample: true
    profile: http://hl7.org/fhir/StructureDefinition/PersonalRelationship
  PersonalRelationship/jane-mother-mary:
    name: Jane is Mary's mother
    description: Jane (source) is the mother (relationshipType) of Mary (target), with certain confidence.
    isExample: true
    profile: http://hl7.org/fhir/StructureDefinition/PersonalRelationship
  PersonalRelationship/mary-daughter-john:
    name: Mary is John's daughter
    description: Mary (source) is the daughter (relationshipType) of John (target), with certain confidence.
    isExample: true
    profile: http://hl7.org/fhir/StructureDefinition/PersonalRelationship
  VerificationResult/example:
    name: VerificationResult - general
    description: A general verification result example
    isExample: true
    profile: http://hl7.org/fhir/StructureDefinition/VerificationResult

pages:
  index.md:
    title: Patient Administration Incubator
  changes.md:
    title: Change Log

menu:
  Home: index.html
  FHIR Artifacts:
      Artifacts: artifacts.html
      Change Log: changes.html
